app-id: pl.fuzjajadrowa.pulsar
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node22
command: Pulsar
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --talk-name=org.kde.StatusNotifierWatcher
  - --env=PULSAR_DIST=flatpak
  - --env=PULSAR_REQUIREMENTS_DIR=/app/lib/pulsar/requirements
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/pulsar/cargo
    RUSTUP_HOME: /run/build/pulsar/rustup
    CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - /share/gtk-doc
  - /share/doc
modules:
  - shared-modules/libayatana-appindicator/libayatana-appindicator-gtk3.json
  - name: deno
    buildsystem: simple
    build-commands:
      - install -Dm755 deno /app/lib/pulsar/requirements/deno
      - install -d /app/bin
      - ln -sf /app/lib/pulsar/requirements/deno /app/bin/deno
    sources:
      - type: archive
        url: https://github.com/denoland/deno/releases/download/v2.9.8/deno-x86_64-unknown-linux-gnu.zip
        sha256: e890975bc2549807bbcc0b584ffafda72cc7c93349dd99c80483dd784f6c4609
        only-arches:
          - x86_64
      - type: archive
        url: https://github.com/denoland/deno/releases/download/v2.9.8/deno-aarch64-unknown-linux-gnu.zip
        sha256: d49596c20b9788cf8f5d8ddf644103d4bde56ed239753f0bdb92ba9361d51905
        only-arches:
          - aarch64
  - name: pulsar-bridge
    buildsystem: simple
    build-options:
      prefix: /app/lib/pulsar/requirements
      prepend-path: /app/lib/pulsar/requirements/bin
    build-commands:
      - python3 -m PyInstaller --clean --onefile --icon icon.png --collect-all yt_dlp_ejs --name pulsar-bridge main.py
      - install -Dm755 dist/pulsar-bridge /app/lib/pulsar/requirements/pulsar-bridge
      - install -Dm644 flatpak/bridge-version.txt /app/lib/pulsar/requirements/bridge-version.txt
    cleanup:
      - /bin
      - /lib/python3*/site-packages
      - /lib/python3*/dist-packages
    modules:
      - bridge-sources.json
    sources:
      - type: git
        url: https://github.com/FuzjaJadrowa/Pulsar-Bridge.git
        tag: b32
  - name: pulsar
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node22/bin
    build-commands:
      - install -d /app/lib/pulsar/requirements
      - ln -sf /usr/bin/ffmpeg /app/lib/pulsar/requirements/ffmpeg
      - ln -sf /usr/bin/ffprobe /app/lib/pulsar/requirements/ffprobe
      - npm ci --offline --cache flatpak-node/npm-cache
      - npm run tauri:build -- --no-bundle
      - install -Dm755 src-tauri/target/release/Pulsar /app/bin/Pulsar
      - install -Dm644 src-tauri/flatpak/pl.fuzjajadrowa.pulsar.desktop /app/share/applications/pl.fuzjajadrowa.pulsar.desktop
      - install -Dm644 src-tauri/flatpak/pl.fuzjajadrowa.pulsar.metainfo.xml /app/share/metainfo/pl.fuzjajadrowa.pulsar.metainfo.xml
      - install -Dm644 assets/icons/pulsar/icon.png /app/share/icons/hicolor/512x512/apps/pl.fuzjajadrowa.pulsar.png
    sources:
      - type: git
        url: https://github.com/fuzjajadrowa/Pulsar.git
        commit: 2cb316fa3d8ec866058ba5cf15ce8bf22c2eadce
      - cargo-sources.json
      - node-sources.json